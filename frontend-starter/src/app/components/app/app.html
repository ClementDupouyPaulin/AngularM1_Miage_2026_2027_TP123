<a class="skip-link" href="#contenu" (click)="skipToContent($event, main)">
  Aller au contenu principal
</a>

<header>
  <a class="brand" routerLink="/">
    <svg class="brand-logo" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false">
      <path fill="currentColor" d="M12 2c5 0 8 3 8 7 0 6-5 13-8 13S4 15 4 9c0-4 3-7 8-7z" />
    </svg>
    <span class="brand-text">
      <b>Guitar Practice Cloud</b>
      <small>Le cloud qui manque à votre ampli</small>
    </span>
  </a>

  <nav aria-label="Navigation principale">
    @if (auth.token()) {
      <a routerLink="/tracks" routerLinkActive="active" ariaCurrentWhenActive="page">
        Backing tracks
      </a>
      <a routerLink="/clips" routerLinkActive="active" ariaCurrentWhenActive="page">Film Pulse</a>
      <a routerLink="/profile" routerLinkActive="active" ariaCurrentWhenActive="page">Profil</a>
    } @else {
      <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Connexion</a>
      <a routerLink="/register" routerLinkActive="active" ariaCurrentWhenActive="page">
        Inscription
      </a>
    }
  </nav>

  @if (auth.token()) {
    <div class="account">
      @if (auth.currentUser(); as user) {
        <span class="account-name" data-testid="header-user-name">{{ user.name }}</span>
      }
      <button type="button" class="logout" data-testid="logout-button" (click)="logout()">
        Déconnexion
      </button>
    </div>
  }
</header>

<main id="contenu" tabindex="-1" #main>
  <router-outlet />
</main>
