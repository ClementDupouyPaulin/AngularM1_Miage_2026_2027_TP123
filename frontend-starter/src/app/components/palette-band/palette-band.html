<div
  class="band"
  #band
  role="slider"
  tabindex="0"
  aria-label="Palette dominante"
  aria-valuemin="0"
  [attr.aria-valuemax]="duration()"
  [attr.aria-valuenow]="valueNow()"
  [attr.aria-valuetext]="valueText()"
  (click)="onClick($event)"
  (keydown)="onKeydown($event)"
>
  <svg class="colors" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true" focusable="false">
    @if (stops().length > 0) {
      <defs>
        <linearGradient [attr.id]="gradientId" x1="0" x2="1" y1="0" y2="0">
          @for (stop of stops(); track $index) {
            <stop [attr.offset]="stop.offset + '%'" [attr.stop-color]="stop.color" />
          }
        </linearGradient>
      </defs>
      <rect x="0" y="0" width="100" height="10" [attr.fill]="'url(#' + gradientId + ')'" />
    } @else {
      <rect class="empty" x="0" y="0" width="100" height="10" />
    }
  </svg>
  <span class="cursor" [style.left.%]="cursorPercent()" aria-hidden="true"></span>
</div>
